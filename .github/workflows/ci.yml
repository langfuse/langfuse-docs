permissions:
  contents: read
name: "CI"

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Add pre-job to skip duplicate actions in merge queues
  pre-job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    timeout-minutes: 15
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          skip_after_successful_duplicate: "true"
          do_not_skip: '["workflow_dispatch", "schedule", "merge_group"]'

  check_h1:
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run H1 heading check
        run: node scripts/check-h1-headings.js

  format:
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Check Prettier formatting
        run: pnpm run format:check

  # check-notebook-docs-sync:
  #   needs:
  #     - pre-job
  #   if: needs.pre-job.outputs.should_skip != 'true'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

  #     - name: Install uv
  #       uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
  #       with:
  #         version: "latest"

  #     - name: Check if notebook docs are up to date
  #       run: |
  #         # Run the update script
  #         bash scripts/update_cookbook_docs.sh

  #         # Check if any files changed (staged, unstaged, or untracked)
  #         if [[ -n $(git status --porcelain) ]]; then
  #           echo "❌ Repository has changes after regenerating cookbook documentation!"
  #           echo "The following files have changes:"
  #           git status --porcelain
  #           echo ""
  #           echo "Please run 'bash scripts/update_cookbook_docs.sh' locally and commit the changes."
  #           echo ""
  #           echo "Detailed diff:"
  #           git diff
  #           git diff --staged
  #           exit 1
  #         else
  #           echo "✅ Repository is up to date after regenerating cookbook documentation"
  #         fi

  build-and-check-links:
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        id: pnpm-install
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Run link and sitemap checker unit tests
        run: pnpm run test:link-check

      - name: Build next.js app
        run: pnpm build

      - name: Start production server
        id: server
        run: |
          pnpm start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:3333 > /dev/null; do sleep 1; done'

      - name: Check markdown and source links
        run: pnpm link-check

      # Run even if the preceding link check failed, but only with a ready server.
      - name: Check sitemap URLs
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: pnpm sitemap-check

      - name: Stop production server
        if: always()
        run: kill "$SERVER_PID" || true

  # Preserve the existing required check name; both suites run in the job above.
  check-sitemap-links:
    needs:
      - pre-job
      - build-and-check-links
    if: ${{ !cancelled() && needs.pre-job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify shared build and checks passed
        env:
          RESULT: ${{ needs.build-and-check-links.result }}
        run: test "$RESULT" = success

  # Summary job that depends on all other jobs
  # This allows you to require only this single check in branch protection rules
  all-checks-pass:
    runs-on: ubuntu-latest
    needs: [
        pre-job,
        check_h1,
        format,
        # check-notebook-docs-sync,
        build-and-check-links,
        check-sitemap-links,
      ]
    if: always()
    steps:
      - name: Successful CI
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
        working-directory: .
      - name: Failing CI
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
        working-directory: .

permissions:
  contents: read
name: "CI"

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Add pre-job to skip duplicate actions in merge queues
  pre-job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    timeout-minutes: 15
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          skip_after_successful_duplicate: "true"
          do_not_skip: '["workflow_dispatch", "schedule", "merge_group"]'

  check_h1:
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Run H1 heading check
        run: bun scripts/check-h1-headings.js

  check_middle_dot:
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Run middle dot check
        run: bun scripts/check-middle-dot.js

  format:
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check formatting
        run: bun fmt --check

  test:
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

  # check-notebook-docs-sync:
  #   needs:
  #     - pre-job
  #   if: needs.pre-job.outputs.should_skip != 'true'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

  #     - name: Install uv
  #       uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
  #       with:
  #         version: "latest"

  #     - name: Check if notebook docs are up to date
  #       run: |
  #         # Run the update script
  #         bash scripts/update_cookbook_docs.sh

  #         # Check if any files changed (staged, unstaged, or untracked)
  #         if [[ -n $(git status --porcelain) ]]; then
  #           echo "❌ Repository has changes after regenerating cookbook documentation!"
  #           echo "The following files have changes:"
  #           git status --porcelain
  #           echo ""
  #           echo "Please run 'bash scripts/update_cookbook_docs.sh' locally and commit the changes."
  #           echo ""
  #           echo "Detailed diff:"
  #           git diff
  #           git diff --staged
  #           exit 1
  #         else
  #           echo "✅ Repository is up to date after regenerating cookbook documentation"
  #         fi

  build-and-check-links:
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build next.js app
        run: bun run build

      - name: Start production server
        run: |
          bun run start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:3333 > /dev/null; do sleep 1; done'

      - name: Check markdown and source links
        run: bun run link-check

      - name: Stop production server
        if: always()
        run: kill "$SERVER_PID" || true

  check-sitemap-links:
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build next.js app
        run: bun run build

      - name: Start production server
        run: |
          bun run start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:3333 > /dev/null; do sleep 1; done'

      - name: Check sitemap URLs
        run: bun run sitemap-check

      - name: Stop production server
        if: always()
        run: kill "$SERVER_PID" || true

  # Summary job that depends on all other jobs
  # This allows you to require only this single check in branch protection rules
  all-checks-pass:
    runs-on: ubuntu-latest
    needs: [
        pre-job,
        check_h1,
        check_middle_dot,
        format,
        test,
        # check-notebook-docs-sync,
        build-and-check-links,
        check-sitemap-links,
      ]
    if: always()
    steps:
      - name: Successful CI
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
        working-directory: .
      - name: Failing CI
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
        working-directory: .

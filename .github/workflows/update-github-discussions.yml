name: Update generated repo data

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read
  discussions: read

jobs:
  update-generated-data:
    runs-on: ubuntu-latest
    environment: "main"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Update cached GitHub star count
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-stars.js

      - name: Generate contributors
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/authors/generate-contributors.js

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Run load_github_discussions.py
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --with requests --python 3.12 -- python scripts/load_github_discussions.py

      - name: Build sitemap and generate llms.txt
        run: pnpm run build
        # The llms.txt generation happens automatically as part of the postbuild process

      - name: Append llms.txt to available-internal-links cursor rule
        run: |
          # Find the line number where "// Start of LLMs.txt" appears
          LINE_NUM=$(grep -n "// Start of LLMs.txt" .agents/cursor/rules/available-internal-links.mdc | cut -d: -f1)

          if [ -n "$LINE_NUM" ]; then
            # Keep the file content up to that line
            head -n $LINE_NUM .agents/cursor/rules/available-internal-links.mdc > temp_file
            echo "" >> temp_file  # Add a blank line after the marker
            
            # Filter the llms.txt content - replace absolute links with relative ones
            cat public/llms.txt public/llms-docs.txt public/llms-integrations.txt public/llms-self-hosting.txt | sed 's|https://langfuse.com||g' >> temp_file
            
            mv temp_file .agents/cursor/rules/available-internal-links.mdc
            echo "Successfully appended llms.txt content to available-internal-links.mdc with relative links"
          else
            echo "Could not find '// Start of LLMs.txt' marker in available-internal-links.mdc"
            exit 1
          fi

      # The app is a bypass actor on the main branch ruleset; GITHUB_TOKEN cannot bypass required status checks.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DOCS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      # The build modifies files that are not committed, so only staged changes decide whether to commit.
      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/generated/contributors.json src/github-stars.ts src/langfuse_github_discussions.json public/github-discussions-sitemap.xml .agents/cursor/rules/available-internal-links.mdc
          git diff --staged --quiet || (git commit -m "chore: update generated GitHub data, sitemap, and internal links rule" && git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_REF#refs/heads/}")
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}

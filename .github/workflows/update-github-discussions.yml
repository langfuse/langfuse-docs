name: Update generated repo data

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch: # Allows manual triggering

permissions: {}

concurrency:
  group: update-generated-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      discussions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Update cached GitHub star count
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-stars.js

      - name: Generate contributors
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/authors/generate-contributors.js

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Run load_github_discussions.py
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --with requests --python 3.12 -- python scripts/load_github_discussions.py

      - name: Build sitemap and generate llms.txt
        run: pnpm run build
        # The llms.txt generation happens automatically as part of the postbuild process

      - name: Collect generated files
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/generated"
          mkdir -p "$out"
          cp data/generated/contributors.json src/github-stars.ts src/langfuse_github_discussions.json public/github-discussions-sitemap.xml "$out/"
          cat public/llms.txt public/llms-docs.txt public/llms-integrations.txt public/llms-self-hosting.txt > "$out/llms-combined.txt"

      - name: Upload generated files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-data
          path: ${{ runner.temp }}/generated
          if-no-files-found: error
          retention-days: 1

  # Holds the write credential: run only inline shell and pinned actions here, never repo code or dependencies.
  # The artifact from `generate` is untrusted input.
  publish:
    needs: generate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: "main"
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download generated files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-data
          path: ${{ runner.temp }}/generated

      - name: Validate and apply generated files
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/generated"
          fail() { echo "::error::$1"; exit 1; }

          [ -z "$(find "$src" -mindepth 1 ! -type f)" ] || fail "artifact contains non-regular files"
          expected=$'contributors.json\ngithub-discussions-sitemap.xml\ngithub-stars.ts\nlangfuse_github_discussions.json\nllms-combined.txt'
          [ "$(cd "$src" && find . -type f -printf '%P\n' | LC_ALL=C sort)" = "$expected" ] || fail "unexpected artifact file set"

          # Roughly 3x current sizes
          check_size() { [ "$(stat -c %s "$src/$1")" -le "$2" ] || fail "$1 is larger than $2 bytes"; }
          check_size github-stars.ts 100
          check_size contributors.json 300000
          check_size langfuse_github_discussions.json 7000000
          check_size github-discussions-sitemap.xml 1500000
          check_size llms-combined.txt 300000

          # github-stars.ts is compiled into the site, so it is rewritten from the validated number only.
          stars_file=$(cat "$src/github-stars.ts")
          [[ "$stars_file" =~ ^export\ const\ GITHUB_STARS\ =\ ([0-9]{1,7})\;$ ]] || fail "github-stars.ts has unexpected content"
          stars="${BASH_REMATCH[1]}"

          jq -e 'type == "object" and all(to_entries[];
              (.key | test("^/[A-Za-z0-9/_.-]+$"))
              and (.value | type == "array" and all(.[]; type == "string" and test("^[A-Za-z0-9](-?[A-Za-z0-9])*(\\[bot\\])?$"))))' \
            "$src/contributors.json" > /dev/null || fail "contributors.json has unexpected content"

          jq -e '(.categories | type == "array")
              and all(.categories[]; .discussions | type == "array")
              and all(.categories[].discussions[]; .href | type == "string" and test("^https://github\\.com/orgs/langfuse/discussions/[0-9]+$"))' \
            "$src/langfuse_github_discussions.json" > /dev/null || fail "langfuse_github_discussions.json has unexpected content"

          # The sitemap is served from langfuse.com, so every line must match the generator's exact format.
          sitemap_line='<\?xml version="1\.0" \?>|<urlset xmlns="http://www\.sitemaps\.org/schemas/sitemap/0\.9">|</urlset>|  <url>|  </url>'
          sitemap_line+='|    <loc>https://github\.com/orgs/langfuse/discussions/[0-9]+</loc>'
          sitemap_line+='|    <lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+[+-][0-9]{2}:[0-9]{2}</lastmod>'
          sitemap_line+='|    <priority>0\.[0-9]</priority>'
          [ "$(grep -cvxE "$sitemap_line" "$src/github-discussions-sitemap.xml" || true)" = 0 ] || fail "github-discussions-sitemap.xml has unexpected content"

          cp "$src/contributors.json" data/generated/contributors.json
          printf 'export const GITHUB_STARS = %s;' "$stars" > src/github-stars.ts
          cp "$src/langfuse_github_discussions.json" src/langfuse_github_discussions.json
          cp "$src/github-discussions-sitemap.xml" public/github-discussions-sitemap.xml

          # The rule's header always comes from main; only the part after the marker is generated.
          rule=.agents/cursor/rules/available-internal-links.mdc
          marker_line=$(grep -n "// Start of LLMs.txt" "$rule" | cut -d: -f1)
          [ -n "$marker_line" ] || fail "marker missing in $rule"
          { head -n "$marker_line" "$rule"; echo; sed 's|https://langfuse.com||g' "$src/llms-combined.txt"; } > "$RUNNER_TEMP/rule"
          mv "$RUNNER_TEMP/rule" "$rule"

          git add -- data/generated/contributors.json src/github-stars.ts src/langfuse_github_discussions.json public/github-discussions-sitemap.xml "$rule"
          [ -z "$(git status --porcelain --untracked-files=all | grep -v '^M  ' || true)" ] || fail "changes outside the allowed files"

      # The app is a bypass actor on the main branch rulesets; GITHUB_TOKEN cannot bypass them.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DOCS_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push if changed
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          g() { /usr/bin/git -c core.hooksPath=/dev/null -c user.name='GitHub Action' -c user.email='action@github.com' "$@"; }
          g commit -m "chore: update generated GitHub data, sitemap, and internal links rule"
          g push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main

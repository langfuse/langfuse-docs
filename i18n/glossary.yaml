# Translation glossary for the docs translation pipeline (scripts/translate).
#
# Every entry is sent to the model with each translation request, and the
# `keep` entries are checked after translation.
#
# - `keep: true`: never translate. Use for brand and product names, Langfuse
#   feature names that are proper nouns, plan and role names, and UI labels.
#   The Langfuse UI is English-only, so anything the reader has to find in the
#   UI stays in English.
# - Otherwise, give the required translation per language. Omit a language to
#   let the model choose.
# - `note`: guidance passed to the model, e.g. when a term is ambiguous.
#
# Status: DRAFT. Each language needs a sign-off from a native speaker before
# its first translations are published. Record the reviewer in `reviewedBy`.
#
# Sources:
# - Japanese entries follow the existing human translation of the Academy
#   (content/academy/japan) where it uses the term.
# - Where the terms overlap, entries match the ClickHouse docs, so Langfuse and
#   ClickHouse read the same in every language: the translated Langfuse and
#   ClickStack pages on clickhouse.com/docs (translated with General
#   Translation), and the ClickHouse glossary in ClickHouse/clickhouse-docs
#   (scripts/translate/glossary.csv and languages/jp.json). The Japanese
#   Academy wins where the two disagree (instrumentation: 計装).

reviewedBy:
  fr: null
  ja: null
  ko: null
  es: null
  zh: null

rules:
  all:
    - Keep code, identifiers, CLI commands, environment variables, file names, URLs, and API fields exactly as in the source.
    - Keep the names of third-party products, frameworks, model providers, and libraries in English (for example OpenAI, LangChain, Vercel AI SDK, Kubernetes).
    - Keep UI labels in English when the text tells the reader to find, click, or select them (for example "Click **New Prompt**"). You may add a translation in parentheses the first time a label appears on a page.
    - Keep Langfuse plan names (Hobby, Core, Pro, Teams, Enterprise) and RBAC role names (Owner, Admin, Member, Viewer, None) in English.
  ja:
    - Use the polite です/ます style.
    - Put a half-width space between Japanese text and Latin words (for example "Langfuse のトレース"), as the Japanese Academy does, but not before Japanese punctuation (、。).
    - Use katakana for established loanwords (トレース, スパン, データセット) and keep English for terms marked keep.
  ko:
    - Use the formal 합니다 style.
    - Use established Korean loanwords for common technical terms (트레이스, 데이터셋, 프롬프트) and keep English for terms marked keep.
  fr:
    - Use "vous", never "tu".
    - "Follow French typography: a non-breaking space before : ; ? ! and « » quotes in prose."
    - Many developer terms are used in English in French technical writing; follow the glossary instead of forcing a French equivalent.
  es:
    - Use "tú" (informal second person), which is common in Spanish developer documentation.
    - Use neutral international Spanish, not a regional variant.
  zh:
    - Write Simplified Chinese (zh-CN) and address the reader as "您".
    - Use full-width punctuation (，。：；？！（）) in Chinese sentences, and put a space between Chinese characters and Latin words or numbers (for example "在 Langfuse 中创建 3 个评分").
    - Keep English for terms marked keep and for Span, which Chinese developer documentation usually leaves untranslated.


minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true

# Already present when adopting the cooldown; future versions must age normally.
minimumReleaseAgeExclude:
  - "@internationalized/date@3.12.4"
  - "@internationalized/number@3.6.8"
  - "@smithy/fetch-http-handler@5.8.0"
  - "@smithy/node-http-handler@4.12.1"
  - "@smithy/types@4.18.0"
  - "hls.js@1.7.2"
  - "react-aria@3.52.0"
  - "react-stately@3.50.0"
  - "undici@6.28.1"
  - "undici@7.29.1"

enablePrePostScripts: true

overrides:
  "@types/react": "^19.2.18"
  "@types/react-dom": "^19.2.7"

allowBuilds:
  # Funding message only; no build output.
  core-js: false
  esbuild: true
  protobufjs: true
  # Downloads the browser used by local PDF exports.
  puppeteer: true
  sharp: true

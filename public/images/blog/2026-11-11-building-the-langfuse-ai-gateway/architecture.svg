<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-rendering="geometricPrecision"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#4f39f6"></path></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6b6b66"></path></marker></defs><rect width="760" height="460" fill="#f6f6f3"></rect><text x="20" y="38.4" font-size="22" font-weight="600" fill="#222220">The request path</text><text x="20" y="62.65" font-size="15" fill="#6b6b66">Purple runs while the agent waits; grey runs in the background</text><rect x="20" y="105" width="170" height="80" rx="10" fill="#ffffff" stroke="#cfcfc9"></rect><text x="105" y="140" font-size="15" font-weight="600" fill="#222220" text-anchor="middle">Coding agent</text><text x="105" y="160" font-size="13" fill="#6b6b66" text-anchor="middle">Claude Code, Codex</text><rect x="295" y="105" width="170" height="80" rx="10" fill="#ecebfe" stroke="#4f39f6" stroke-width="2"></rect><text x="380" y="140" font-size="15" font-weight="600" fill="#4f39f6" text-anchor="middle">AI Gateway</text><text x="380" y="160" font-size="13" fill="#3d3d38" text-anchor="middle">Rust, stateless</text><rect x="570" y="105" width="170" height="80" rx="10" fill="#ffffff" stroke="#cfcfc9"></rect><text x="655" y="140" font-size="15" font-weight="600" fill="#222220" text-anchor="middle">Model provider</text><text x="655" y="160" font-size="13" fill="#6b6b66" text-anchor="middle">OpenAI, Anthropic</text><line x1="194" y1="145" x2="291" y2="145" stroke="#4f39f6" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"></line><text x="242.5" y="135" font-size="13" fill="#3d3d38" text-anchor="middle">Native API</text><text x="242.5" y="164" font-size="13" fill="#6b6b66" text-anchor="middle">streamed</text><line x1="469" y1="145" x2="566" y2="145" stroke="#4f39f6" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"></line><text x="517.5" y="135" font-size="13" fill="#3d3d38" text-anchor="middle">Native API</text><text x="517.5" y="164" font-size="13" fill="#6b6b66" text-anchor="middle">streamed</text><rect x="200" y="255" width="360" height="165" rx="12" fill="none" stroke="#a7a7a0" stroke-dasharray="5 4"></rect><text x="380" y="406" font-size="13" font-weight="600" fill="#6b6b66" text-anchor="middle">Langfuse Web (existing container)</text><rect x="215" y="275" width="155" height="105" rx="10" fill="#ffffff" stroke="#cfcfc9"></rect><text x="292.5" y="309" font-size="15" font-weight="600" fill="#222220" text-anchor="middle">Control plane</text><text x="292.5" y="333" font-size="13" fill="#6b6b66" text-anchor="middle">Keys, credentials,</text><text x="292.5" y="353" font-size="13" fill="#6b6b66" text-anchor="middle">routing, roles</text><rect x="390" y="275" width="155" height="105" rx="10" fill="#ffffff" stroke="#cfcfc9"></rect><text x="467.5" y="309" font-size="15" font-weight="600" fill="#222220" text-anchor="middle">Ingestion</text><text x="467.5" y="333" font-size="13" fill="#6b6b66" text-anchor="middle">Traces, analytics,</text><text x="467.5" y="353" font-size="13" fill="#6b6b66" text-anchor="middle">evals, alerts</text><line x1="330" y1="189" x2="330" y2="271" stroke="#4f39f6" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"></line><text x="322" y="228" font-size="13" fill="#3d3d38" text-anchor="end">Resolve key</text><text x="322" y="246" font-size="13" fill="#3d3d38" text-anchor="end">and model (cached)</text><line x1="440" y1="189" x2="440" y2="271" stroke="#6b6b66" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"></line><text x="448" y="228" font-size="13" fill="#6b6b66">Traces, async</text><text x="448" y="246" font-size="13" fill="#6b6b66">and batched</text><text x="20" y="446" font-size="14" fill="#6b6b66">The gateway keeps no state; everything it needs comes from the control plane in Langfuse Web.</text></svg>
